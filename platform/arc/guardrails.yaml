apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: arc-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runner-budget
  namespace: arc-runners
spec:
  hard:
    limits.cpu: "12"
    limits.memory: 24Gi
    pods: "12"
    requests.cpu: "6"
    requests.memory: 12Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-unsolicited-ingress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
