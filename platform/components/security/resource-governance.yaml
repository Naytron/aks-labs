apiVersion: v1
kind: ResourceQuota
metadata:
  name: orders
  namespace: orders
spec:
  hard:
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "30"
    requests.cpu: "2"
    requests.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: orders
  namespace: orders
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 48Mi
