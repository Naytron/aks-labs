apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: orders-api
  namespace: orders
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storefront
  namespace: orders
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
