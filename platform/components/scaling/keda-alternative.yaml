apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: storefront
  namespace: orders
spec:
  scaleTargetRef:
    name: storefront
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
