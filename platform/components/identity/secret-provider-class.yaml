apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orders-key-vault
  namespace: orders
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WORKLOAD_IDENTITY_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: course-api-key
          objectType: secret
          objectVersion: ""
    tenantId: ${TENANT_ID}
