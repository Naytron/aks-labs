apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders
  namespace: flux-system
spec:
  interval: 5m
  path: ./platform/environments/azure-day3
  prune: true
  sourceRef:
    kind: GitRepository
    name: orders
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: course-values
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: storefront
      namespace: orders
    - apiVersion: apps/v1
      kind: Deployment
      name: orders-api
      namespace: orders
