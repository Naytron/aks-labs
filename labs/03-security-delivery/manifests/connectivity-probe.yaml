apiVersion: v1
kind: Pod
metadata:
  name: connectivity-probe
  namespace: orders
  labels:
    aks-course: level400
    purpose: debug
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: python:3.14.0-slim-trixie@sha256:0aecac02dc3d4c5dbb024b753af084cafe41f5416e02193f1ce345d671ec966e
      command:
        - python
        - -c
        - import time; time.sleep(3600)
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          cpu: 50m
          memory: 48Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
