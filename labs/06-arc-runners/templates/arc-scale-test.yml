# Copy this file only to the private sandbox repository.
# The course deployment creates the arc-aks-lab runner scale set.
name: ARC scale test

'on':
  workflow_dispatch: {}

permissions: {}

jobs:
  bounded-shell-test:
    name: Safe runner slot ${{ matrix.slot }}
    runs-on: arc-aks-lab
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - name: Exercise one ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'slot=%s\n' '${{ matrix.slot }}'
          printf 'runner=%s\n' "${RUNNER_NAME}"
          sleep 30
          printf 'complete\n'
