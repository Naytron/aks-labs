apiVersion: batch/v1
kind: Job
metadata:
  name: spot-workload
  namespace: orders
  labels:
    aks-course: level400
    purpose: spot
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        aks-course: level400
        purpose: spot
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        workload: interruptible
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: python:3.14.0-slim-trixie@sha256:0aecac02dc3d4c5dbb024b753af084cafe41f5416e02193f1ce345d671ec966e
          command:
            - python
            - -c
            - import time; print("interruptible work started", flush=True); time.sleep(120); print("complete")
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
