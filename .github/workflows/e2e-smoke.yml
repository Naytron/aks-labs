name: E2E local bootcamp smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-e2e:
    name: Dev Container, Compose, and kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Run safe local E2E
        shell: pwsh
        run: ./scripts/test-e2e.ps1 -LocalOnly

      - name: Upload redacted E2E evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aks-bootcamp-e2e-${{ github.run_id }}
          path: artifacts/e2e/
          if-no-files-found: error
          retention-days: 14
